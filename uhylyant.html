<title>Ухилянт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Розкладка: липка шапка зі статусом, сцена з персонажем, прокручуваний вміст вкладки, нижня навігація. Тема: нічний бетон, папір «повістки», сигнальні жовтий і червоний. */
:root{
  --bg:#12161a;
  --panel:#1a2026;
  --panel-2:#222a32;
  --line:#2f3944;
  --ink:#e9edf0;
  --muted:#8f9ba8;
  --paper:#dfe4e6;
  --paper-ink:#1b2127;
  --amber:#ffb41f;
  --amber-edge:#b27a00;
  --green:#58d27b;
  --red:#ff5444;
  --red-edge:#a82a1f;
  --blue:#5aa9ff;
  --gold:#ffd04a;
  --font-display:'Oswald','Arial Narrow','Impact',sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.35;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h2,h3,p{margin:0}

.hud{flex:none;display:flex;flex-direction:column;gap:6px;padding:8px 0 8px}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.lvl{flex:none;min-width:46px;height:36px;display:grid;place-items:center;padding:0 8px;border-radius:10px;background:var(--amber);color:#201600;font:700 18px/1 var(--font-display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.who-txt{min-width:0;display:flex;flex-direction:column}
.who-txt b{font-weight:600;font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-txt small{color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wallet{display:flex;align-items:center;gap:6px;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip.gold{color:var(--gold)}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--muted)}
.icon-btn svg{width:18px;height:18px}
.bar{height:7px;border-radius:4px;background:#0b0e11;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .3s}
.bar.xp i{background:var(--blue)}
.bar.en{height:10px}
.bar.en i{background:var(--amber)}
.hud-bot{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.energy{flex:1 1 180px;display:flex;align-items:center;gap:8px;min-width:0}
.energy svg{flex:none;width:16px;height:16px;color:var(--amber)}
.energy .bar{flex:1}
.energy span{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.status{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag.green{background:rgba(88,210,123,.16);color:var(--green)}
.tag.red{background:rgba(255,84,68,.16);color:var(--red)}
.tag.amber{background:rgba(255,180,31,.16);color:var(--amber)}
.tag.gray{background:var(--panel-2);color:var(--muted)}

.scene{position:relative;flex:none;border-radius:16px;overflow:hidden;border:1px solid var(--line);aspect-ratio:360/176;background:#222}
.scene>svg{display:block;width:100%;height:100%}
.bubble{position:absolute;left:8px;right:8px;top:8px;padding:7px 10px;border-radius:12px;background:rgba(14,18,22,.82);font-size:12.5px;line-height:1.3;border:1px solid rgba(255,255,255,.08)}
.bubble:empty{display:none}

.content>*{flex:none}
.content{flex:1;min-height:0;overflow-y:auto;padding:12px 0 14px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.h{font:700 13px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.grow{flex:1;min-width:0}
.name{font-weight:600;font-size:14.5px}
.sub{color:var(--muted);font-size:12.5px}
.hint{color:var(--muted);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}
.btn{appearance:none;border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 14px;font-weight:600;font-size:14px;cursor:pointer;background:var(--panel-2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn:disabled{opacity:.45;cursor:default}
.btn.amber{background:var(--amber);color:#211600;border-color:transparent;box-shadow:0 3px 0 var(--amber-edge)}
.btn.red{background:var(--red);color:#fff;border-color:transparent;box-shadow:0 3px 0 var(--red-edge)}
.btn.gold{background:#3a3115;border-color:#6d5a1c;color:var(--gold)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.big{min-height:52px;font-size:16px;width:100%}
.btn.block{width:100%}
.meter{height:8px;border-radius:4px;background:#0b0e11;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px}

.risk{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.risk b.big{font:700 30px/1 var(--font-display);font-variant-numeric:tabular-nums}

.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel-2);border-radius:10px;padding:8px 6px;text-align:center}
.stat b{display:block;font:700 22px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pill{flex:none;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);border-radius:999px;height:34px;padding:0 14px;font-weight:600;font-size:13px;cursor:pointer}
.pill.on{background:var(--amber);color:#211600;border-color:transparent}

.item{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:10px;align-items:center}
.thumb{width:58px;height:58px;border-radius:12px;background:#0f1317;border:2px solid var(--rar,#8f9aa8);overflow:hidden;display:grid;place-items:center}
.thumb svg{width:100%;height:100%;display:block}
.rar{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--rar)}
.eqd{outline:2px solid var(--green);outline-offset:-2px}

.paper{background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.paper .sub,.paper .hint{color:#55616d}
.paper .btn{background:#cfd6d9;border-color:#b3bcc1;color:var(--paper-ink)}
.paper .btn.amber{background:var(--amber);border-color:transparent}
.paper .btn.red{background:var(--red);color:#fff;border-color:transparent;box-shadow:0 3px 0 var(--red-edge)}
.paper .btn.gold{background:#3a3115;border-color:#6d5a1c;color:var(--gold)}
.paper-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--paper-ink);padding-bottom:6px}
.paper-head b{font:700 17px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.paper-head span{font-size:12px;font-weight:600}
.stamp{align-self:flex-start;font:700 13px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--red-edge);border:2px solid var(--red-edge);padding:4px 8px;border-radius:4px;transform:rotate(-3deg)}
.stg-row{display:flex;align-items:center;gap:6px}
.stg{flex:none;font:700 12px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:6px;background:#c5ccd0;color:#6a7680}
.stg.on{background:var(--red);color:#fff}
.stg.done{background:#9aa5ab;color:#e9eef0;text-decoration:line-through}
.stg-line{flex:1;height:2px;background:#9aa5ab}
.odds{display:flex;align-items:baseline;gap:10px}
.odds b{font:700 44px/1 var(--font-display);color:var(--red-edge)}

.pips{display:flex;gap:4px}
.pips i{flex:1;height:6px;border-radius:3px;background:#0b0e11}
.pips i.on{background:var(--amber)}
.ladder{display:flex;flex-direction:column;gap:6px}
.ladder div{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}
.ladder div.on{color:var(--ink);font-weight:600}
.ladder div.done{color:var(--green)}

.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 0 6px;border-top:1px solid var(--line)}
.tab{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500;font-size:11px;padding:6px 0;border-radius:10px;cursor:pointer;position:relative}
.tab.on{color:var(--amber);background:rgba(255,180,31,.1)}
.tab svg{width:22px;height:22px}
.tab .dot{position:absolute;top:4px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--red)}

.overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(8,10,13,.8);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{width:min(100%,380px);max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 18px 16px;display:flex;flex-direction:column;gap:12px;animation:rise .25s ease-out;-webkit-user-select:text;user-select:text}
.dlg h2{font:700 28px/1.05 var(--font-display);letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.dlg p{color:var(--muted);line-height:1.45}
.dlg label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dlg input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);padding:0 12px;font-size:16px}
.prev{height:150px;border-radius:14px;background:#0f1317;display:grid;place-items:center}
.prev svg{height:100%;width:auto}
.swatches{display:flex;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--amber)}
.list{display:flex;flex-direction:column;gap:8px}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);max-width:calc(100% - 32px);background:var(--paper);color:var(--paper-ink);padding:10px 16px;border-radius:14px;font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:120;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--red);color:#fff}
.toast.good{background:var(--green);color:#0c2514}

@media (prefers-reduced-motion:reduce){.dlg{animation:none}.bar i{transition:none}}
/* ===== мультяшна камера ===== */
:root{--bg:#1e1a15;--panel:#2d2720;--panel-2:#3d342a;--line:#0e0b08;--ink:#f3e9d2;--muted:#b9ab8f;--paper:#e8dcb8;--paper-ink:#2a2118;--amber:#f2a931;--amber-edge:#9a5f08;--green:#7bc47f;--red:#e85c45;--red-edge:#8f2417;--blue:#6fa3d8;--gold:#ffd04a}
body{background:#1e1a15 repeating-linear-gradient(0deg,#0000 0 31px,#ffffff08 31px 32px),repeating-linear-gradient(90deg,#0000 0 63px,#ffffff06 63px 64px)}
.hud{background:repeating-linear-gradient(135deg,#2d2720 0 12px,#251f19 12px 24px);margin:0 -16px;padding:8px 16px;border-bottom:4px solid var(--line)}
.card,.paper{border:3px solid var(--line)!important;box-shadow:0 4px 0 var(--line);border-radius:16px!important}
.btn{border:3px solid var(--line)!important;box-shadow:0 3px 0 var(--line);border-radius:12px!important;font-family:var(--font-display);letter-spacing:.04em;text-transform:uppercase}
.btn:active:not(:disabled){box-shadow:0 1px 0 var(--line)}
.btn small{display:block;font:500 11px var(--font-body);text-transform:none;opacity:.8}
.chip,.lvl,.tag,.pill{border:2px solid var(--line)!important}
.scene{border:4px solid var(--line)!important;border-radius:14px!important;box-shadow:0 4px 0 var(--line)}
.tabs{border-top:4px solid var(--line);background:#251f19}.tab.on{color:var(--amber)}
.cell circle,.cell rect,.cell path{stroke:#15110d;stroke-width:2.5}.cell .smoke,.cell text{stroke:none}
.bxatk{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bxav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#111;border:3px solid var(--line);flex:none}
.dmg{position:absolute;font:700 32px var(--font-display);color:#ffd04a;-webkit-text-stroke:2px #5a140c;paint-order:stroke fill;animation:up 1s ease-out forwards;pointer-events:none;z-index:3}
@keyframes up{to{transform:translateY(-60px) scale(1.3);opacity:0}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes lamp{0%,100%{opacity:.55}10%{opacity:.25}20%{opacity:.6}60%{opacity:.45}63%{opacity:.15}}
@keyframes barm{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-35deg)}90%{transform:rotate(10deg)}}
@keyframes smoke{0%{transform:translate(0,0);opacity:.7}100%{transform:translate(8px,-26px) scale(2);opacity:0}}
@keyframes punch{40%{transform:translateX(70px) rotate(6deg)}}
@keyframes hurt{20%{transform:translateX(9px) rotate(3deg);filter:brightness(2) saturate(0)}50%{transform:translateX(-6px)}}
@keyframes shk{25%{transform:translate(3px,2px)}75%{transform:translate(-3px,-2px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 2.4s ease-in-out infinite}.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
.lamp{animation:lamp 3s infinite}.barm{animation:barm 3.2s infinite;transform-box:fill-box;transform-origin:top center}
.smoke{animation:smoke 2.5s infinite;transform-box:fill-box}.punch{animation:punch .35s}.hurt{animation:hurt .4s}.shk{animation:shk .25s}
@keyframes mote{0%,100%{transform:translate(0,0);opacity:0}30%{opacity:.9}60%{transform:translate(14px,-18px);opacity:.5}}
.mote{animation:mote 7s ease-in-out infinite}
.scene::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 50%,#0009 120%),linear-gradient(#ff9a3c14,#0000)}
/* ===== ПК-версія ===== */
@media (hover:hover){.btn:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}.tab:hover{color:var(--ink)}.pill:hover{filter:brightness(1.15)}}
@media (min-width:900px) and (min-height:560px){
 body{display:grid;grid-template-columns:minmax(440px,1.15fr) minmax(400px,1fr);grid-template-rows:auto minmax(0,1fr) auto;column-gap:22px;max-width:1280px;margin:0 auto;width:100%;padding-left:24px;padding-right:24px}
 .hud{grid-column:1/-1;margin:10px 0 0;border:3px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line)}
 .scene{grid-column:1;grid-row:2;align-self:start;margin-top:14px;max-height:none}
 .content{grid-column:2;grid-row:2;padding-right:6px}
 .tabs{grid-column:2;grid-row:3;border:3px solid var(--line);border-radius:16px;margin:6px 0 10px}
 .hud-top,.hud-bot{font-size:15px}
 .content::-webkit-scrollbar{width:10px}.content::-webkit-scrollbar-thumb{background:var(--panel-2);border:2px solid var(--line);border-radius:6px}
 .kbd{display:inline-block}
}
.kbd{display:none;font:600 11px var(--font-body);background:#0006;border-radius:5px;padding:1px 6px;margin-left:6px}
@media (hover:hover) and (min-width:900px){.kbd{display:inline-block}}

/* ===== графіка: тири, діалоги, друзі ===== */
.lvl.t1{background:#9aa6b2}.lvl.t2{background:#7bc47f}.lvl.t3{background:#6fa3d8}.lvl.t4{background:#b57cf2}.lvl.t5{background:#ff9a3c}.lvl.t6{background:#ff5d6c;color:#fff}
.lvl.t7{background:linear-gradient(110deg,#ffd04a 30%,#fff3b0 50%,#ffd04a 70%) 0 0/200% 100%;animation:shine 2.5s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.dlg{border:4px solid var(--line)!important;box-shadow:0 6px 0 var(--line);border-radius:18px!important}
.fin{flex:1;min-width:0;height:44px;border-radius:12px;border:3px solid var(--line);background:#14100c;color:var(--ink);padding:0 12px;font:600 16px var(--font-body);letter-spacing:.12em;text-transform:uppercase;user-select:text;-webkit-user-select:text}
.idbox{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#14100c;border:3px dashed var(--amber);border-radius:12px;padding:8px 12px}.idv{font:700 26px var(--font-display);letter-spacing:.18em;color:var(--amber);user-select:text;-webkit-user-select:text}
.fl1,.fl2{opacity:0;animation:fl 1s steps(1) infinite}.fl2{animation-delay:.5s}@keyframes fl{0%{opacity:.26}50%{opacity:0}}
.cloud{animation:drift 45s linear infinite}@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(440px)}}
.rain{animation:rain .8s linear infinite}@keyframes rain{from{transform:translateY(-16px)}to{transform:translateY(190px)}}

/* V7: integrated comic layout; no overlay scene and no duplicate fixed dock */
:root{--bg:#17120f;--panel:#292018;--panel-2:#392b20;--line:#8c643b;--ink:#f5e6c9;--muted:#c5ac86;--paper:#e5cba0;--paper-ink:#2a1d11;--amber:#f4b637;--amber-edge:#925417;--red:#c44932;--green:#88c36c}
html,body{width:100%;max-width:none;min-width:0;background:#14100d!important}
body{padding:0 14px!important;gap:0!important;overflow:hidden!important}
.hud{background:linear-gradient(135deg,#32251b,#1b1713)!important;border:2px solid #9a6f3d!important;border-radius:8px!important;margin:8px 0!important;padding:10px 14px!important;box-shadow:0 5px 0 #080605!important}
.scene{background:#19130f url('/assets/noir-courtyard-day.webp') center center/cover no-repeat!important;border:3px solid #b58a53!important;border-radius:8px!important;min-height:220px;aspect-ratio:16/9!important;box-shadow:0 7px 25px #0009!important;isolation:isolate}
.scene[data-night="true"]{background-image:url('/assets/noir-courtyard-night.webp')!important}
.scene>svg{opacity:0!important;pointer-events:none!important}
.scene::before{content:'УХИЛЯНТ';position:absolute;left:3%;top:6%;z-index:2;font:900 clamp(28px,4vw,68px)/1 var(--font-display);color:#ffc044;-webkit-text-stroke:1px #261409;text-shadow:3px 4px #160b06,5px 6px #000;pointer-events:none}
.scene::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0c080766,transparent 55%),linear-gradient(0deg,#08060577,transparent 45%);pointer-events:none}

const tier=()=>tierOf(S.level);
function raid(){const b=Math.floor(now()/(15*MIN));const x=Math.sin(b*12.9898)*43758.5453,f=x-Math.floor(x);return{lvl:f<.4?0:f<.8?1:2,until:(b+1)*15*MIN}}
const RAID=[{n:'Низький',m:.65,c:'green'},{n:'Середній',m:1,c:'amber'},{n:'Високий',m:1.5,c:'red'}];
function bronState(){const t=now();if(S.bronUntil>t)return'real';if(S.fakeUntil>t)return'fake';return''}
function riskFor(mod){
  if(S.end==='eu')return 0;
  if(S.end==='ua'&&S.ua.link>=5)return 0;
  let r=.30-gear().st*.004+mod;
  if(S.wantedUntil>now())r+=.15;
  r*=RAID[raid().lvl].m;
  if(S.end==='ua')r-=S.ua.link*.07;
  return clamp(r,.03,.7);
}

/* ---------- повідомлення ---------- */
let toastT=0;
function toast(m,k){const el=$('#toast');el.textContent=m;el.className='toast show '+(k||'');clearTimeout(toastT);toastT=setTimeout(()=>{el.className='toast'},2000)}
function say(m){S.say=m;const b=$('#bubble');if(b)b.textContent=m}
const pick=a=>a[rnd(a.length)];

/* ---------- рівні, гроші ---------- */
function gainMoney(n){S.uah+=n;S.st.earned+=n}
function gainXP(x){
  const before=S.level,rk=rankOf(S.level);
  S.xp+=x/XP_DIV(S.level);
  let guard=0;
  while(S.xp>=xpNeed(S.level)&&guard++<20000){S.xp-=xpNeed(S.level);S.level++}
  if(S.level>before){
    toast('Рівень '+S.level+(rankOf(S.level)!==rk?' · '+rankOf(S.level):''),'good');
    if(tierOf(S.level)>tierOf(before))say('Відкрились кращі підробітки й одяг!');
  }
  if(S.level>=MAXLVL&&!S.end&&!S.askedEnd){S.askedEnd=true;setTimeout(showChoose,500)}
}

/* ---------- ТЦК ---------- */
const bribeCost=()=>basePay(tier())*10;
const CAUGHT_TXT=['З-за рогу виїхав бус. «Громадянине, на хвилинку!»','Тебе зупинили біля магазину. «Документи, будь ласка».','«Просто перевіримо дані», — сказав чоловік у формі.'];
const TCC_TXT=['Тебе завели в обласний ТЦК. Двері зачинені, але охорона на секунду відволіклась.','Тебе везуть на навчання. Бус став на заправці. Це шанс.','Ти на позиціях. Шансів мало, але вони є.'];
function caught(fake){
  S.tcc={stage:0,nextAt:0,busy:false};S.st.caught++;
  if(fake){S.fakeUntil=0;S.bronUntil=S.bronUntil>now()?S.bronUntil:0}
  say(fake?'Бронь виявилась липовою. Тебе забрали.':pick(CAUGHT_TXT));
  save();render();
}
function outing(mod){
  const b=bronState();
  if(b==='real')return true;
  if(Math.random()<riskFor(mod)){caught(b==='fake');return false}
  return true;
}
function tccTry(){
  const t=S.tcc;if(!t||t.busy||now()<t.nextAt)return;
  t.busy=true;render();
  setTimeout(()=>{
    if(!S.tcc)return;
    t.busy=false;
    if(Math.random()<ESC[t.stage]){
      S.tcc=null;S.wantedUntil=now()+15*MIN;S.st.escaped++;
      gainXP(xpNeed(S.level));
      say(pick(['Ти рвонув у двори й зник у підʼїзді.','Охорона відвернулась на мить, і ти на волі!','Перелізти паркан було важко, але вийшло.']));
      toast('Втік! Тебе шукатимуть 15 хвилин','good');
    }else if(t.stage<2){
      t.stage++;say(pick(['Двері зачинено. Спроба не вдалась.','Тебе наздогнали й повернули в бус.']));
    }else{
      t.nextAt=now()+TCC_CD;say('Не вийшло. Наступна спроба за кілька хвилин.');
    }
    save();render();
  },1300);
}
function release(txt){S.tcc=null;S.wantedUntil=now()+5*MIN;say(txt);toast(txt,'good');save();render()}

/* ---------- робота ---------- */
function gigPay(j,k){return Math.round(basePay(j.t)*payMult()*k)}
function doGig(ji,remote){
  if(S.tcc)return;
  const j=JOBS[ji],en=remote?8:10;
  if(!spend(en))return;
  if(!j.remote&&!outing(j.r)){return}
  const pay=gigPay(j,remote?.7:1);
  gainMoney(pay);S.st.shifts++;
  say(j.remote?'Відпрацював удома: +₴'+fmt(pay):pick(['Зміна відпрацьована.','День пройшов спокійно.','Гроші на руки: ','Повернувся без пригод. '])+(j.remote?'':'+₴'+fmt(pay)));
  gainXP(xpGain(en,S.level,j.remote?.8:1));
  save();render();
}
function empPay(){const j=JOBS[S.job.ji];return Math.round(basePay(j.t)*S.job.mult*payMult())}
function doShift(){
  if(S.tcc||!S.job)return;
  const j=JOBS[S.job.ji];
  if(!spend(12))return;
  if(!j.remote&&!outing(j.r)){return}
  const pay=empPay();gainMoney(pay);S.st.shifts++;
  say('Зміна на «'+S.job.emp+'»: +₴'+fmt(pay));
  gainXP(xpGain(12,S.level,1.3));
  save();render();
}
function search(){
  if(S.tcc)return;
  if(!spend(8))return;
  if(!outing(.04))return;
  const t=tier(),pool=JOBS.filter(j=>j.t<=t&&j.t>=Math.max(0,t-1));
  S.offers=[0,1,2].map(()=>({ji:pick(pool).i,emp:pick(EMP),bron:Math.random()<.6,scam:.15+Math.random()*.3,mult:1.3+Math.random()*.4}));
  S.offersAt=now();
  say('Знайшов кілька оголошень.');save();render();
}
function accept(i,withBron){
  const o=S.offers&&S.offers[i];if(!o)return;
  const fee=basePay(JOBS[o.ji].t)*6;
  if(withBron){
    if(S.uah<fee){toast('Не вистачає гривень','bad');return}
    S.uah-=fee;
    if(Math.random()<o.scam){S.fakeUntil=now()+12*HOUR}else{S.bronUntil=Math.max(S.bronUntil,now())+12*HOUR}
    say('Роботодавець оформив бронь на 12 годин. Документи виглядають справжніми.');
  }else say('Тебе взяли на роботу.');
  S.job={ji:o.ji,emp:o.emp,mult:o.mult};S.offers=null;save();render();
}
function quit(){S.job=null;say('Ти звільнився.');save();render()}

/* ---------- дім ---------- */
const foodCost=()=>Math.round(basePay(tier())*.3);
function food(){
  if(now()-S.foodAt<30000){toast('Ще не зголоднів','bad');return}
  const c=foodCost();if(S.uah<c){toast('Не вистачає гривень','bad');return}
  S.uah-=c;S.foodAt=now();syncEnergy();S.energy=Math.min(maxEnergy(),S.energy+20);
  say('Борщ зроблений. Сили повертаються.');save();render();
}
const dailyReady=()=>now()-S.dailyAt>20*HOUR;
function daily(){
  if(!dailyReady())return;
  const v=basePay(tier())*5;S.dailyAt=now();gainMoney(v);say('Щоденний бонус: +₴'+fmt(v));toast('Бонус ₴'+fmt(v),'good');save();render();
}

/* ---------- одяг ---------- */
function buy(id){
  const it=ITEM[id];if(!it||S.inv.includes(id))return;
  if(S.level<it.lvl){toast('Потрібен рівень '+it.lvl,'bad');return}
  if(it.gold){if(S.gold<it.gold){toast('Не вистачає золота','bad');return}S.gold-=it.gold}
  else{if(S.uah<it.price){toast('Не вистачає гривень','bad');return}S.uah-=it.price}
  S.inv.push(id);S.eq[it.slot]=id;toast('Куплено: '+it.name,'good');save();render();
}
function equip(id){const it=ITEM[id];if(it&&S.inv.includes(id)){S.eq[it.slot]=id;save();render()}}

/* ---------- донат ---------- */
function buyBron(h,cost){
  if(S.gold<cost){toast('Не вистачає золота','bad');return}
  S.gold-=cost;S.bronUntil=Math.max(S.bronUntil,now())+h*HOUR;S.fakeUntil=0;
  say('Справжня бронь оформлена на '+(h>=24?h/24+' '+pl(h/24,['добу','доби','діб']):h+' год')+'. Можна виходити.');toast('Бронь діє','good');save();render();
}
function buyEnergy(){
  if(S.gold<15){toast('Не вистачає золота','bad');return}
  S.gold-=15;syncEnergy();S.energy=maxEnergy();toast('Енергія повна','good');save();render();
}
function goldFree(){
  if(!S.tcc)return;
  if(S.gold<GOLD_FREE){toast('Не вистачає золота','bad');return}
  S.gold-=GOLD_FREE;release('Тебе звільнили достроково');
}

/* ---------- фінал ---------- */
function choose(kind){
  S.end=kind;S.askedEnd=true;S.tcc=null;
  if(kind==='eu'){S.eu={country:-1,eur:0,lang:0,job:0,home:0};hideOv();say('Ти на кордоні. Далі нова країна.');save();render();showCountry()}
  else{S.ua={pos:0,biz:0,link:0,bizAt:now()};hideOv();say('Ти лишаєшся. Час будувати карʼєру.');save();render()}
}
const COUNTRY=[['Польща',1],['Німеччина',1.25],['Чехія',1.05],['Нідерланди',1.2],['Іспанія',.95]];
function euWork(){
  if(!spend(10))return;
  const v=euIncome(S.eu,COUNTRY[Math.max(0,S.eu.country)][1]*ngMult());
  S.eu.eur+=v;S.st.shifts++;say('Зміна в Європі: +€'+fmt(v));save();render();checkEnding();
}
function upgrade(tr){
  if(S.end==='eu'){
    const T=EU[tr],k=S.eu[tr]+1;
    if(k>=T.s.length)return;
    const need=euNeed(tr,k),has=tr==='job'?S.eu.lang:S.eu.job;
    if(tr!=='lang'&&has<need){toast('Спершу підтягни '+(tr==='job'?'мову':'карʼєру'),'bad');return}
    if(S.eu.eur<T.c[k]){toast('Не вистачає євро','bad');return}
    S.eu.eur-=T.c[k];S.eu[tr]=k;toast(T.n+': '+T.s[k],'good');
  }else if(S.end==='ua'){
    const T=UA[tr],k=S.ua[tr]+1;
    if(k>=T.s.length)return;
    if(S.uah<T.c[k]){toast('Не вистачає гривень','bad');return}
    S.uah-=T.c[k];S.ua[tr]=k;toast(T.n+': '+T.s[k],'good');
  }
  save();render();checkEnding();
}
function bizAcc(){const h=Math.min(12,(now()-S.ua.bizAt)/HOUR);return Math.floor(UAB*BIZ_RATE[S.ua.biz]*h)}
function collect(){const v=bizAcc();if(v<=0)return;gainMoney(v);S.ua.bizAt=now();toast('Дохід бізнесу +₴'+fmt(v),'good');save();render()}
function checkEnding(){
  if(S.seenEnd)return;
  const done=S.end==='eu'?(S.eu.lang>=5&&S.eu.job>=7&&S.eu.home>=4):S.end==='ua'?(S.ua.pos>=5&&S.ua.biz>=5&&S.ua.link>=5):false;
  if(!done)return;
  S.seenEnd=true;save();netSync(true);
  showOv(S.end==='eu'
   ?'<h2>Ти влаштувався</h2><p>Своя справа, свій дім, чужа мова, яку ти вже знаєш. Ніхто не питає документи на кожному розі.</p><button class="btn amber big" data-act="ngplus">Нове життя (+25% до доходів)</button><button class="btn block" data-act="closeOv">Лишитись тут</button>'
   :'<h2>Критичне підприємство</h2><p>Твоя фірма має бронь, а ти маєш звʼязки. ТЦК більше не торкнеться тебе в цьому місті.</p><button class="btn amber big" data-act="ngplus">Нове життя (+25% до доходів)</button><button class="btn block" data-act="closeOv">Лишитись тут</button>');
}
function ngplus(){const keep={name:S.name,look:S.look,gold:S.gold,ng:S.ng+1};S=Object.assign(S0(),keep,{started:true});hideOv();ui.tab='home';save();render();say('Нове життя. Ти знову на початку, але з досвідом.')}

   +(max?'':'<div class="sub">Далі: '+esc(T.s[k])+(req&&req.has<req.need(k)?' · потрібно: '+req.what+' рівня '+req.need(k):'')+'</div>')+'</div>';

function openEditor(focus){
backup={look:{...S.look},eq:{...S.eq},cfg:{...cfg}};
opts(by('uhySkin'),SKIN.map((_,i)=>[i,['Світлий','Середній','Смаглявий','Темний'][i]]));
opts(by('uhyHair'),HAIR.map((_,i)=>[i,['Чорне','Каштанове','Світле','Руде','Сиве'][i]]));
opts(by('uhyPlace'),Object.entries(scenes));
by('uhySkin').value=String(S.look.skin);
by('uhyHair').value=String(S.look.hair);
by('uhyBeardStatus').textContent=beardNow()+' мм · наступний міліметр через 5 хв';
by('uhyPlace').value=cfg.location;
const fields=by('uhyGearFields');fields.innerHTML='';
Object.entries(slots).forEach(([slot,label])=>{
const select=document.createElement('select');select.id='uhyGear_'+slot;
const owned=(S.inv||[]).filter(id=>ITEM[id]?.slot===slot);
if(!owned.includes(S.eq[slot])&&ITEM[S.eq[slot]])owned.unshift(S.eq[slot]);
opts(select,owned.filter(id=>ITEM[id]).map(id=>[id,ITEM[id].name]));
select.value=S.eq[slot];select.addEventListener('change',preview);
const lab=document.createElement('label');lab.htmlFor=select.id;lab.textContent=label;
fields.append(lab,select);
});
by('uhyHomeLabel').textContent='Твій будинок: '+({shack:'Халупа',room:'Кімната',flat:'Квартира',loft:'Лофт',lux:'Пентхаус'}[currentHouse]||'Халупа');
root.classList.add('is-open');root.setAttribute('aria-hidden','false');
preview();by(focus==='location'?'uhyPlace':'uhySkin').focus();
}
function preview(){
const look={...S.look,skin:+by('uhySkin').value,hair:+by('uhyHair').value};
const eq={...S.eq};Object.keys(slots).forEach(k=>{const el=by('uhyGear_'+k);if(el)eq[k]=el.value});
const place=by('uhyPlace').value;
by('uhyPreview').style.backgroundImage='url("'+bgPath(place,currentHouse)+'")';
by('uhyPreview').innerHTML=avatar(look,eq,beardNow());
}
root.querySelectorAll('select').forEach(el=>el.addEventListener('change',preview));
by('uhyShave').onclick=async()=>{
 if(!NET?.id)return alert('Спочатку увійди до акаунта');
 const r=await api('world',{action:'shave'});if(!r?.ok)return alert(r?.err||'Не вдалося поголитися');
 updateCare(r);sceneRender();preview();by('uhyBeardStatus').textContent='0 мм · щойно поголився';
};
function close(){root.classList.remove('is-open');root.setAttribute('aria-hidden','true')}
by('uhyClose').onclick=close;
root.addEventListener('click',e=>{if(e.target===root)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&root.classList.contains('is-open'))close()});
by('uhyApply').onclick=()=>{
const nextEq={...S.eq};
Object.keys(slots).forEach(k=>{
 const el=by('uhyGear_'+k),id=el?.value;
 if(id&&ITEM[id]?.slot===k&&(S.inv||[]).includes(id))nextEq[k]=id;
});
S.look={...S.look,skin:+by('uhySkin').value,hair:+by('uhyHair').value};
S.eq=nextEq;
cfg.location=allowed(by('uhyPlace').value,Object.keys(scenes),'yard');

localStorage.setItem(SCENE_KEY,JSON.stringify(cfg));
save();if(typeof netSync==='function')netSync(true);
close();render();
};
function updateCare(data){
 if(!data?.care)return;
 avatarCare={...data.care,at:Date.now(),lastUpdated:Date.now()};
}
async function syncHousing(){
try{
if(!NET?.id||!NET?.key)return;
const data=await api('world');
updateCare(data);const house=data?.world?.housing?.current;
if(['shack','room','flat','loft','lux'].includes(house)){
currentHouse=house;
if(!S.tcc&&ui.tab!=='boss')sceneRender();
}
}catch(e){}
}
if(S.started&&!S.tcc&&ui.tab!=='boss')sceneRender();
setTimeout(syncHousing,1400);setInterval(syncHousing,45000);
setInterval(()=>{if(S.started&&!S.tcc&&ui.tab!=='boss'){const badge=document.querySelector('#scene .uhy-vitals');const mm=beardNow();if(lastNight!==night()||!badge||badge.dataset.mm!==String(mm))sceneRender();if(document.querySelector('#uhyEditor.is-open')){by('uhyBeardStatus').textContent=mm+' мм';preview()}}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncHousing();if(S.started&&!S.tcc&&ui.tab!=='boss')sceneRender()}});
if(!S.started)showIntro();
else{ui.lastSig=sigNow();render()}
})();
</script>




</body></html>
